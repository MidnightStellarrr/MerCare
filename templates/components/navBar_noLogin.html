{% load static %}
<link rel="stylesheet" href="{% static 'css/navBar_noLogin.css' %}">

<nav class="mercare-navbar">
    <div class="mercare-nav-container">

        <!-- Logo -->
        <a href="{% url 'home' %}" class="mercare-logo">
            <img src="{% static 'images/landingPage/mercare_logo.png' %}" alt="MerCare Logo">
        </a>

        <!-- Search Bar -->
        <form class="mercare-search" action="#" method="GET">
            <button type="submit" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
            </button>
            <input type="text" name="q" placeholder="Search Product..." aria-label="Search products">
        </form>

        {% if user.is_authenticated %}
            {% include 'components/nav_user_actions.html' %}
        {% else %}
            <div class="nav-actions">
                <a href="{% url 'login' %}" class="btn btn-outline">Log In</a>
                <div class="dropdown">
                    <button class="btn btn-primary dropdown-toggle">
                        Register <span class="caret">▾</span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="{% url 'registerCustomer' %}">Register as Customer</a></li>
                        <li><a href="{% url 'step1' %}">Register as Pharmacy</a></li>
                    </ul>
                </div>
            </div>
        {% endif %}

    </div>
</nav>

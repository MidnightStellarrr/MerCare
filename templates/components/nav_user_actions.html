{% load static %}
<link rel="stylesheet" href="{% static 'css/navUserActions.css' %}">

<div class="nav-actions user-actions">

    {# Customer-only icons (pharmacy owners just get the profile menu) #}
    {% if not user.pharmacy %}

        <!-- Notifications -->
        <a href="#" class="nav-icon" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </a>

        <!-- Orders -->
        <a href="{% url 'account_orders' %}" class="nav-icon" title="My Orders" aria-label="My Orders">
            <svg viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </a>

        <!-- Wishlist -->
        <a href="#" class="nav-icon" title="Wishlist" aria-label="Wishlist">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </a>

        <!-- Cart -->
        <a href="#" class="nav-icon" title="Cart" aria-label="Cart">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            {# <span class="icon-badge">3</span> #}
        </a>

    {% endif %}

    <!-- Profile menu -->
    <div class="dropdown profile-menu">
        <button type="button" class="profile-toggle" aria-label="Account menu">
            <span class="profile-pic">
                {% if user.customer.profile_picture %}
                    <img src="{{ user.customer.profile_picture.url }}" alt="">
                {% else %}
                    {{ user.first_name|default:user.email|first|upper }}
                {% endif %}
            </span>
            <span class="profile-info">
                <span class="profile-name">{{ user.first_name|default:user.email }}</span>
                <span class="profile-email">{{ user.email }}</span>
            </span>
            <span class="caret">▾</span>
        </button>
        <ul class="dropdown-menu">
            <li><a href="{% url 'account_orders' %}">My Profile</a></li>
            <li>
                <form action="{% url 'logout' %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="menu-logout">Log Out</button>
                </form>
            </li>
        </ul>
    </div>

</div>
